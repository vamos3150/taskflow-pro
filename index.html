<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;

const SUPABASE_URL='https://zuxhkqvkwanygululhdm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1eGhrcXZrd2FueWd1bHVsaGRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTYwODUsImV4cCI6MjA5MzczMjA4NX0.gKfM_iegmA-Uw4C4ch4i3xnQYwuJiAAJzLpvM_TL8Gg';

// ─── Crypto / Auth ────────────────────────────────────────────────────
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ─── Utilities ────────────────────────────────────────────────────────
function now(){return new Date().toISOString()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}

// ─── Session ──────────────────────────────────────────────────────────
const SESSION_KEY='tfp_session';
function getActiveSession(){
  try{
    const ls=localStorage.getItem(SESSION_KEY);
    if(ls)return JSON.parse(ls);
    const ss=sessionStorage.getItem(SESSION_KEY);
    if(ss)return JSON.parse(ss);
  }catch{}
  return null;
}
function setSession(u,remember){
  const s={user_id:u.id,display_name:u.display_name,color:u.color,username:u.username,role:u.role};
  if(remember)localStorage.setItem(SESSION_KEY,JSON.stringify(s));
  else sessionStorage.setItem(SESSION_KEY,JSON.stringify(s));
}
function clearSession(){localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(SESSION_KEY);}

// ─── CRUD (Supabase async) ────────────────────────────────────────────
const CRUD={
  // Projects
  async getProjects(){
    const{data,error}=await supabase.from('tfp_projects').select('*').order('created_at',{ascending:true});
    if(error)throw error;
    return data||[];
  },
  async createProject(data){
    const p={id:uid(),created_at:now(),...data};
    const{data:res,error}=await supabase.from('tfp_projects').insert(p).select().single();
    if(error)throw error;
    return res;
  },
  async updateProject(id,data){
    const{data:res,error}=await supabase.from('tfp_projects').update(data).eq('id',id).select().single();
    if(error)throw error;
    return res;
  },
  async deleteProject(id){
    // cascade: delete subtasks/comments for tasks in this project
    const{data:tasks}=await supabase.from('tfp_tasks').select('id').eq('project_id',id);
    if(tasks&&tasks.length){
      const tids=tasks.map(t=>t.id);
      await supabase.from('tfp_subtasks').delete().in('task_id',tids);
      await supabase.from('tfp_comments').delete().in('task_id',tids);
    }
    await supabase.from('tfp_tasks').delete().eq('project_id',id);
    const{error}=await supabase.from('tfp_projects').delete().eq('id',id);
    if(error)throw error;
  },

  // Tasks
  async getTasks(f={}){
    let q=supabase.from('tfp_tasks').select('*');
    if(f.project_id)q=q.eq('project_id',f.project_id);
    if(f.status)q=q.eq('status',f.status);
    if(f.priority)q=q.eq('priority',f.priority);
    if(f.assignee)q=q.eq('assignee',f.assignee);
    if(f.q)q=q.ilike('title',`%${f.q}%`);
    q=q.order('created_at',{ascending:true});
    const{data:tasks,error}=await q;
    if(error)throw error;
    if(!tasks||tasks.length===0)return[];

    // fetch subtasks for progress calculation
    const tids=tasks.map(t=>t.id);
    const{data:allSubs}=await supabase.from('tfp_subtasks').select('*').in('task_id',tids);
    const subMap={};
    (allSubs||[]).forEach(s=>{if(!subMap[s.task_id])subMap[s.task_id]=[];subMap[s.task_id].push(s);});

    return tasks.map(t=>{
      const subs=subMap[t.id]||[];
      const autoP=subs.length?Math.round(subs.filter(s=>s.status==='done').length/subs.length*100):0;
      return{...t,subtask_count:subs.length,done_subtask_count:subs.filter(s=>s.status==='done').length,effective_progress:t.progress||autoP};
    });
  },
  async getTask(id){
    const{data:t,error}=await supabase.from('tfp_tasks').select('*').eq('id',id).single();
    if(error)throw error;
    const[{data:subtasks},{data:comments}]=await Promise.all([
      supabase.from('tfp_subtasks').select('*').eq('task_id',id).order('created_at',{ascending:true}),
      supabase.from('tfp_comments').select('*').eq('task_id',id).order('created_at',{ascending:true}),
    ]);
    return{...t,subtasks:subtasks||[],comments:comments||[]};
  },
  async createTask(data){
    const t={id:uid(),created_at:now(),updated_at:now(),description:'',assignee:'',labels:'',due_date:null,start_date:null,progress:0,...data};
    const{data:res,error}=await supabase.from('tfp_tasks').insert(t).select().single();
    if(error)throw error;
    return res;
  },
  async updateTask(id,data){
    const{data:res,error}=await supabase.from('tfp_tasks').update({...data,updated_at:now()}).eq('id',id).select().single();
    if(error)throw error;
    return res;
  },
  async deleteTask(id){
    await supabase.from('tfp_subtasks').delete().eq('task_id',id);
    await supabase.from('tfp_comments').delete().eq('task_id',id);
    const{error}=await supabase.from('tfp_tasks').delete().eq('id',id);
    if(error)throw error;
  },

  // Subtasks
  async createSubtask(task_id,title){
    const s={id:uid(),task_id,title,status:'todo',created_at:now()};
    const{data:res,error}=await supabase.from('tfp_subtasks').insert(s).select().single();
    if(error)throw error;
    return res;
  },
  async updateSubtask(id,data){
    const{data:res,error}=await supabase.from('tfp_subtasks').update(data).eq('id',id).select().single();
    if(error)throw error;
    return res;
  },
  async toggleSubtask(id,currentStatus){
    const newStatus=currentStatus==='done'?'todo':'done';
    return CRUD.updateSubtask(id,{status:newStatus});
  },
  async deleteSubtask(id){
    const{error}=await supabase.from('tfp_subtasks').delete().eq('id',id);
    if(error)throw error;
  },

  // Comments
  async createComment(task_id,content,author){
    const c={id:uid(),task_id,author,content,created_at:now()};
    const{data:res,error}=await supabase.from('tfp_comments').insert(c).select().single();
    if(error)throw error;
    return res;
  },
  async deleteComment(id){
    const{error}=await supabase.from('tfp_comments').delete().eq('id',id);
    if(error)throw error;
  },

  // Dashboard
  async getDashboard(pid){
    const tasks=await CRUD.getTasks(pid?{project_id:pid}:{});
    const total=tasks.length;
    const by_status={'未着手':0,'進行中':0,'レビュー中':0,'完了':0};
    const by_assignee={};let overdue=0;
    for(const t of tasks){
      by_status[t.status]=(by_status[t.status]||0)+1;
      if(t.assignee)by_assignee[t.assignee]=(by_assignee[t.assignee]||0)+1;
      if(t.due_date&&new Date(t.due_date)<new Date()&&t.status!=='完了')overdue++;
    }
    const done=by_status['完了']||0;
    return{total,by_status,by_assignee,overdue,completion_rate:total?Math.round(done/total*100*10)/10:0};
  },

  // Users
  async getUsers(){
    const{data,error}=await supabase.from('tfp_users').select('id, username, display_name, color, role, created_at').order('created_at',{ascending:true});
    if(error)throw error;
    return data||[];
  },
  async createUser(data){
    const{data:existing}=await supabase.from('tfp_users').select('id').eq('username',data.username).single();
    if(existing)throw new Error('既に使用されているユーザー名です');
    const hash=await sha256(data.password);
    const u={id:uid(),username:data.username,display_name:data.display_name||data.username,color:data.color||'#6366f1',password_hash:hash,role:'member',created_at:now()};
    const{data:res,error}=await supabase.from('tfp_users').insert(u).select('id,username,display_name,color,role,created_at').single();
    if(error)throw error;
    return res;
  },
  async authenticate(username,password){
    const{data:u,error}=await supabase.from('tfp_users').select('*').eq('username',username).single();
    if(error||!u)throw new Error('ユーザーが見つかりません');
    const hash=await sha256(password);
    if(hash!==u.password_hash)throw new Error('パスワードが違います');
    return u;
  },
  async deleteUser(id){
    const{error}=await supabase.from('tfp_users').delete().eq('id',id);
    if(error)throw error;
  },
  async updateUserRole(id,role){
    const{data:res,error}=await supabase.from('tfp_users').update({role}).eq('id',id).select('id,username,display_name,color,role,created_at').single();
    if(error)throw error;
    return res;
  },
};

// ─── Constants ────────────────────────────────────────────────────────
const STATUSES=['未着手','進行中','レビュー中','完了'];
const PRIORITIES=['高','中','低'];
const ST={
  '未着手':{bg:'bg-gray-100',text:'text-gray-600',dot:'bg-gray-400',colBg:'#f8fafc',border:'#cbd5e1'},
  '進行中':{bg:'bg-blue-100',text:'text-blue-700',dot:'bg-blue-500',colBg:'#eff6ff',border:'#93c5fd'},
  'レビュー中':{bg:'bg-amber-100',text:'text-amber-700',dot:'bg-amber-500',colBg:'#fffbeb',border:'#fcd34d'},
  '完了':{bg:'bg-green-100',text:'text-green-700',dot:'bg-green-500',colBg:'#f0fdf4',border:'#86efac'},
};
const PRI={
  '高':{bg:'bg-red-100',text:'text-red-700',border:'border-red-200'},
  '中':{bg:'bg-amber-100',text:'text-amber-700',border:'border-amber-200'},
  '低':{bg:'bg-green-100',text:'text-green-700',border:'border-green-200'},
};
const AV_COLORS=['#6366f1','#0ea5e9','#f59e0b','#10b981','#ec4899','#8b5cf6','#ef4444','#14b8a6'];
const WEEKDAYS=['日','月','火','水','木','金','土'];
function avc(name=''){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))|0;return AV_COLORS[Math.abs(h)%AV_COLORS.length]}
function ini(name=''){const p=name.trim().split(/\s+/);return p.length>=2?p[0][0]+p[1][0]:(name[0]||'?')}
function fmtDate(d){if(!d)return null;const dt=new Date(d);return`${dt.getMonth()+1}/${dt.getDate()}`}
function fmtDateLong(d){if(!d)return'—';const dt=new Date(d);return`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`}
function isOverdue(d,s){return d&&s!=='完了'&&new Date(d)<new Date()}
function pctColor(p){return p>=80?'#10b981':p>=50?'#3b82f6':p>=20?'#f59e0b':'#e5e7eb'}

// ─── Atoms ────────────────────────────────────────────────────────────
function Avatar({name,size=24}){
  return <div style={{width:size,height:size,borderRadius:'50%',background:avc(name),flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
    <span style={{color:'#fff',fontSize:size*.38,fontWeight:700}}>{ini(name)}</span>
  </div>
}
function PriBadge({p}){const s=PRI[p]||PRI['中'];return <span className={`text-xs font-bold px-1.5 py-0.5 rounded border ${s.bg} ${s.text} ${s.border}`}>{p}</span>}
function StBadge({s}){const st=ST[s]||ST['未着手'];return <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${st.bg} ${st.text}`}>{s}</span>}
function LabelPill({label}){return <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100 font-medium">{label}</span>}

function ProgressBar({pct,height=6}){
  return <div className="rounded-full overflow-hidden bg-gray-100" style={{height}}>
    <div className="h-full rounded-full transition-all" style={{width:`${pct}%`,background:pctColor(pct)}}/>
  </div>
}

function Spinner(){
  return <div className="flex items-center justify-center py-12">
    <div className="w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"/>
  </div>
}

// ─── Login Screen ─────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[mode,setMode]=useState('login');
  const[username,setUsername]=useState('');
  const[password,setPassword]=useState('');
  const[displayName,setDisplayName]=useState('');
  const[remember,setRemember]=useState(true);
  const[error,setError]=useState('');
  const[loading,setLoading]=useState(false);

  async function handleLogin(e){
    e.preventDefault();setError('');setLoading(true);
    try{
      const u=await CRUD.authenticate(username,password);
      setSession(u,remember);
      onLogin({user_id:u.id,display_name:u.display_name,color:u.color,username:u.username,role:u.role});
    }catch(e){setError(e.message)}
    finally{setLoading(false)}
  }
  async function handleRegister(e){
    e.preventDefault();setError('');setLoading(true);
    try{
      const u=await CRUD.createUser({username,password,display_name:displayName||username});
      setSession(u,remember);
      onLogin({user_id:u.id,display_name:u.display_name,color:u.color,username:u.username,role:u.role});
    }catch(e){setError(e.message)}
    finally{setLoading(false)}
  }

  const inp="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white";

  return(
    <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8">
        <div className="flex items-center gap-3 mb-8">
          <div className="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg">
            <span className="text-white font-black text-lg">T</span>
          </div>
          <div>
            <h1 className="font-black text-gray-900 text-xl">TaskFlow Pro</h1>
            <p className="text-xs text-gray-400">チームタスク管理</p>
          </div>
        </div>

        <div className="flex rounded-xl border border-gray-200 p-1 mb-6">
          {['login','register'].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setError('')}}
              className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-colors ${mode===m?'bg-indigo-600 text-white shadow-sm':'text-gray-500 hover:text-gray-700'}`}>
              {m==='login'?'ログイン':'新規登録'}
            </button>
          ))}
        </div>

        <form onSubmit={mode==='login'?handleLogin:handleRegister} className="space-y-4">
          {mode==='register'&&(
            <div>
              <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5 block">表示名</label>
              <input className={inp} value={displayName} onChange={e=>setDisplayName(e.target.value)} placeholder="山田 太郎"/>
            </div>
          )}
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5 block">ユーザー名</label>
            <input className={inp} value={username} onChange={e=>setUsername(e.target.value)} required placeholder="username" autoFocus/>
          </div>
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5 block">パスワード</label>
            <input type="password" className={inp} value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••"/>
          </div>
          <label className="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} className="rounded text-indigo-600"/>
            <span className="text-sm text-gray-600">ログイン状態を保持する</span>
          </label>
          {error&&<p className="text-red-500 text-xs bg-red-50 rounded-lg px-3 py-2">{error}</p>}
          <button type="submit" disabled={loading}
            className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-colors disabled:opacity-50 shadow-sm mt-2">
            {loading?'処理中…':(mode==='login'?'ログイン':'アカウントを作成')}
          </button>
        </form>

        {mode==='login'&&(
          <div className="mt-6 p-4 bg-gray-50 rounded-xl">
            <p className="text-xs font-bold text-gray-500 mb-1">デモアカウント</p>
            <div className="text-xs text-gray-600 space-y-0.5">
              <p>ユーザー名: <span className="font-mono font-semibold">admin</span></p>
              <p>パスワード: <span className="font-mono font-semibold">admin</span></p>
            </div>
          </div>
        )}

        <p className="text-center text-xs text-gray-400 mt-4 flex items-center justify-center gap-1">
          <span>🔒</span> Supabaseに安全に保存されます
        </p>
      </div>
    </div>
  );
}

// ─── Task Card (Kanban) ───────────────────────────────────────────────
function TaskCard({task,onClick,selected}){
  const st=ST[task.status]||ST['未着手'];
  const labels=(task.labels||'').split(',').map(l=>l.trim()).filter(Boolean);
  const pct=task.effective_progress||0;
  return(
    <div draggable onDragStart={e=>e.dataTransfer.setData('taskId',task.id)} onClick={()=>onClick(task.id)}
      style={{borderLeft:`4px solid ${st.border}`}}
      className={`bg-white rounded-xl p-3.5 shadow-sm hover:shadow-md transition-all cursor-pointer ${selected?'ring-2 ring-indigo-400 ring-offset-1':''}`}>
      <div className="flex items-start gap-2 mb-2">
        <p className={`flex-1 text-sm font-semibold leading-snug ${task.status==='完了'?'line-through text-gray-400':'text-gray-800'}`}>{task.title}</p>
        <PriBadge p={task.priority}/>
      </div>
      {labels.length>0&&<div className="flex flex-wrap gap-1 mb-2">{labels.map(l=><LabelPill key={l} label={l}/>)}</div>}
      {pct>0&&<div className="mb-2"><ProgressBar pct={pct} height={4}/><span className="text-xs text-gray-400">{pct}%</span></div>}
      <div className="flex items-center justify-between">
        {task.assignee?<Avatar name={task.assignee} size={22}/>:<span/>}
        {task.due_date&&<span className={`text-xs font-medium ${isOverdue(task.due_date,task.status)?'text-red-500':'text-gray-400'}`}>{fmtDate(task.due_date)}</span>}
      </div>
    </div>
  );
}

function KanbanCol({status,tasks,onDrop,onCard,onNew,selectedId}){
  const[over,setOver]=useState(false);
  const st=ST[status];
  return(
    <div className="kanban-col flex flex-col gap-3">
      <div className="flex items-center justify-between px-1">
        <div className="flex items-center gap-2">
          <span className={`w-2.5 h-2.5 rounded-full ${st.dot}`}/>
          <span className="text-sm font-bold text-gray-700">{status}</span>
          <span className="text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded-full">{tasks.length}</span>
        </div>
        <button onClick={()=>onNew(status)} className="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg text-xl leading-none">+</button>
      </div>
      <div className={`flex-1 min-h-20 rounded-xl p-2 flex flex-col gap-2 transition-colors ${over?'drag-over':''}`}
        style={{background:over?undefined:st.colBg}}
        onDragOver={e=>{e.preventDefault();setOver(true)}}
        onDragLeave={()=>setOver(false)}
        onDrop={e=>{e.preventDefault();setOver(false);onDrop(e.dataTransfer.getData('taskId'),status)}}>
        {tasks.map(t=><TaskCard key={t.id} task={t} onClick={onCard} selected={selectedId===t.id}/>)}
      </div>
      <button onClick={()=>onNew(status)} className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-indigo-600 px-2 py-1 rounded-lg hover:bg-indigo-50">
        <span className="text-lg leading-none">+</span> タスクを追加
      </button>
    </div>
  );
}

// ─── WBS View ─────────────────────────────────────────────────────────
function WBSView({tasks,projects,subtasksMap,onSelect,onNew,selectedId}){
  const[sortKey,setSortKey]=useState('wbs');
  const[sortDir,setSortDir]=useState(1);

  const wbsData=useMemo(()=>{
    const rows=[];
    const grouped={};
    tasks.forEach(t=>{
      if(!grouped[t.project_id])grouped[t.project_id]=[];
      grouped[t.project_id].push(t);
    });

    let pNum=0;
    for(const [pid,ptasks] of Object.entries(grouped)){
      pNum++;
      const proj=projects.find(p=>p.id===pid);
      const allPct=ptasks.length?Math.round(ptasks.reduce((a,t)=>a+(t.effective_progress||0),0)/ptasks.length):0;
      rows.push({type:'project',id:pid,wbs:`${pNum}`,title:proj?.name||pid,level:0,pct:allPct,proj});

      ptasks.forEach((t,ti)=>{
        const subs=subtasksMap[t.id]||[];
        rows.push({type:'task',id:t.id,wbs:`${pNum}.${ti+1}`,title:t.title,level:1,task:t,pct:t.effective_progress||0,subs});

        });
      });
    }
    return rows;

// ─── Calendar View ────────────────────────────────────────────────────
function CalendarView({tasks,onSelect}){
  const[year,setYear]=useState(new Date().getFullYear());
  const[month,setMonth]=useState(new Date().getMonth());

  function prevMonth(){if(month===0){setMonth(11);setYear(y=>y-1)}else setMonth(m=>m-1)}
  function nextMonth(){if(month===11){setMonth(0);setYear(y=>y+1)}else setMonth(m=>m+1)}

  const today=new Date();
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startPad=firstDay.getDay();
  const totalCells=Math.ceil((startPad+lastDay.getDate())/7)*7;

  const tasksByDate={};
  tasks.forEach(t=>{
    if(t.due_date){
      const d=new Date(t.due_date);
      if(d.getFullYear()===year&&d.getMonth()===month){
        const key=d.getDate();
        if(!tasksByDate[key])tasksByDate[key]=[];
        tasksByDate[key].push(t);
      }
    }
  });

  const noDateTasks=tasks.filter(t=>!t.due_date&&t.status!=='完了');

  const cells=[];
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startPad+1;
    const valid=dayNum>=1&&dayNum<=lastDay.getDate();
    cells.push({dayNum,valid,tasks:valid?(tasksByDate[dayNum]||[]):[]});
  }

  const weeks=[];
  for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));

  return(
    <div className="p-4">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-xl font-black text-gray-900">カレンダー</h2>
        <div className="flex items-center gap-3">
          <button onClick={prevMonth} className="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-600 font-bold">‹</button>
          <span className="text-base font-bold text-gray-800 w-28 text-center">{year}年 {month+1}月</span>
          <button onClick={nextMonth} className="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-600 font-bold">›</button>
          <button onClick={()=>{setYear(today.getFullYear());setMonth(today.getMonth())}} className="text-xs px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-bold">今月</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <div className="grid grid-cols-7 border-b border-gray-100">
          {WEEKDAYS.map((w,i)=>(
            <div key={w} className={`py-2.5 text-center text-xs font-black uppercase tracking-wide ${i===0?'text-red-500':i===6?'text-blue-500':'text-gray-500'}`}>{w}</div>
          ))}
        </div>

        {weeks.map((week,wi)=>(
          <div key={wi} className="grid grid-cols-7 border-b border-gray-100 last:border-0" style={{minHeight:100}}>
            {week.map((cell,ci)=>{
              const isToday=cell.valid&&cell.dayNum===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
              const isSun=ci===0,isSat=ci===6;
              return(
                <div key={ci} className={`p-1.5 border-r border-gray-100 last:border-0 cal-day ${!cell.valid?'bg-gray-50/50':''}`} style={{minHeight:90}}>
                  {cell.valid&&(
                    <>
                      <div className="flex justify-end mb-1">
                        <span className={`w-6 h-6 flex items-center justify-center text-xs font-bold rounded-full ${isToday?'bg-indigo-600 text-white':''}${isSun&&!isToday?'text-red-500':''}${isSat&&!isToday?'text-blue-500':''}${!isToday&&!isSun&&!isSat?'text-gray-700':''}`}>
                          {cell.dayNum}
                        </span>
                      </div>
                      <div className="space-y-0.5">
                        {cell.tasks.slice(0,3).map(t=>{
                          const st=ST[t.status]||ST['未着手'];
                          const over=isOverdue(t.due_date,t.status);
                          return(
                            <button key={t.id} onClick={()=>onSelect(t.id)}
                              className="w-full text-left px-1.5 py-0.5 rounded text-xs font-medium truncate transition-colors hover:opacity-80"
                              style={{background:over?'#fee2e2':st.border+'33',color:over?'#dc2626':st.border.replace('3','')}}>
                              {t.title}
                            </button>
                          );
                        })}
                        {cell.tasks.length>3&&<p className="text-xs text-gray-400 px-1">+{cell.tasks.length-3}件</p>}
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {noDateTasks.length>0&&(
        <div className="mt-4 bg-white rounded-2xl border border-gray-100 p-4">
          <p className="text-sm font-bold text-gray-600 mb-3">📌 期限未設定のタスク（{noDateTasks.length}件）</p>
          <div className="flex flex-wrap gap-2">
            {noDateTasks.map(t=>(
              <button key={t.id} onClick={()=>onSelect(t.id)}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-xl border hover:bg-gray-50 transition-colors">
                <PriBadge p={t.priority}/><span className="text-gray-700 font-medium">{t.title}</span>
                {t.assignee&&<Avatar name={t.assignee} size={16}/>}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── User Management View (admin only) ───────────────────────────────
function UserManagementView({currentUser,refresh}){
  const[users,setUsers]=useState([]);
  const[isLoading,setIsLoading]=useState(true);
  const[error,setError]=useState('');

  async function loadUsers(){
    setIsLoading(true);
    try{const data=await CRUD.getUsers();setUsers(data);}
    catch(e){setError(e.message);}
    finally{setIsLoading(false);}
  }
  useEffect(()=>{loadUsers();},[]);

  async function handleDelete(id){
    if(id===currentUser.user_id){alert('自分自身は削除できません');return;}
    if(!confirm('このユーザーを削除しますか？'))return;
    try{await CRUD.deleteUser(id);await loadUsers();}
    catch(e){setError(e.message);}
  }
  async function handleRoleChange(id,newRole){
    try{await CRUD.updateUserRole(id,newRole);await loadUsers();}
    catch(e){setError(e.message);}
  }

  if(isLoading)return<Spinner/>;

  return(
    <div className="p-6 max-w-3xl">
      <h2 className="text-xl font-black text-gray-800 mb-6">ユーザー管理</h2>
      {error&&<p className="text-red-500 text-xs bg-red-50 rounded-lg px-3 py-2 mb-4">{error}</p>}
      <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm">
        <table className="w-full">
          <thead className="bg-gray-50 border-b border-gray-100">
            <tr>
              <th className="text-left px-4 py-3 text-xs font-black text-gray-500 uppercase">ユーザー</th>
              <th className="text-left px-3 py-3 text-xs font-black text-gray-500 uppercase">ユーザー名</th>
              <th className="text-left px-3 py-3 text-xs font-black text-gray-500 uppercase">ロール</th>
              <th className="text-left px-3 py-3 text-xs font-black text-gray-500 uppercase hidden md:table-cell">登録日</th>
              <th className="px-3 py-3"></th>
            </tr>
          </thead>
          <tbody>
            {users.map(u=>(
              <tr key={u.id} className="border-b border-gray-100">
                <td className="px-4 py-3">
                  <div className="flex items-center gap-2">
                    <Avatar name={u.display_name} size={28}/>
                    <span className="text-sm font-semibold text-gray-800">{u.display_name}</span>
                    {u.id===currentUser.user_id&&<span className="text-xs bg-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded-full font-bold">自分</span>}
                  </div>
                </td>
                <td className="px-3 py-3 text-sm text-gray-500 font-mono">{u.username}</td>
                <td className="px-3 py-3">
                  {u.id===currentUser.user_id
                    ?<span className={`text-xs font-bold px-2 py-1 rounded-full ${u.role==='admin'?'bg-indigo-100 text-indigo-700':'bg-gray-100 text-gray-600'}`}>{u.role}</span>
                    :<select value={u.role} onChange={e=>handleRoleChange(u.id,e.target.value)}
                        className="text-xs border border-gray-200 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-200">
                        <option value="admin">admin</option>
                        <option value="member">member</option>
                      </select>
                  }
                </td>
                <td className="px-3 py-3 text-xs text-gray-400 hidden md:table-cell">{fmtDateLong(u.created_at)}</td>
                <td className="px-3 py-3 text-right">
                  {u.id!==currentUser.user_id&&(
                    <button onClick={()=>handleDelete(u.id)} className="text-xs px-2.5 py-1 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 font-semibold">削除</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── Task Form Modal ──────────────────────────────────────────────────
function TaskFormModal({task,projects,defaultStatus,onSave,onClose}){
  const[form,setForm]=useState({
    project_id:task?.project_id??(projects[0]?.id??''),
    title:task?.title??'',description:task?.description??'',
    status:task?.status??defaultStatus??'未着手',priority:task?.priority??'中',
    assignee:task?.assignee??'',labels:task?.labels??'',
    start_date:task?.start_date?task.start_date.slice(0,10):'',
    due_date:task?.due_date?task.due_date.slice(0,10):'',
    progress:task?.progress??0,
  });
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState('');
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const inp="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white";

  async function submit(e){
    e.preventDefault();if(!form.title.trim())return;
    setSaving(true);setError('');
    try{
      const data={...form,project_id:form.project_id,due_date:form.due_date||null,start_date:form.start_date||null,progress:Number(form.progress)||0};
      if(task?.id)await CRUD.updateTask(task.id,data);
      else await CRUD.createTask(data);
      onSave();
    }catch(e){setError(e.message);}
    finally{setSaving(false);}
  }
  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h2 className="font-black text-gray-800">{task?.id?'タスクを編集':'新しいタスク'}</h2>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100 text-gray-400 text-2xl">&times;</button>
        </div>
        <form onSubmit={submit} className="p-6 space-y-4 overflow-y-auto flex-1">
          {error&&<p className="text-red-500 text-xs bg-red-50 rounded-lg px-3 py-2">{error}</p>}
          <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">タイトル *</label>
            <input className={inp} value={form.title} onChange={e=>set('title',e.target.value)} required placeholder="タスクのタイトル" autoFocus/></div>
          <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">説明</label>
            <textarea className={inp} rows={3} value={form.description} onChange={e=>set('description',e.target.value)} placeholder="詳細説明（任意）"/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">ステータス</label>
              <select className={inp} value={form.status} onChange={e=>set('status',e.target.value)}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
            <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">優先度</label>
              <select className={inp} value={form.priority} onChange={e=>set('priority',e.target.value)}>{PRIORITIES.map(p=><option key={p}>{p}</option>)}</select></div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">担当者</label>
              <input className={inp} value={form.assignee} onChange={e=>set('assignee',e.target.value)} placeholder="担当者名"/></div>
            <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">ラベル</label>
              <input className={inp} value={form.labels} onChange={e=>set('labels',e.target.value)} placeholder="デザイン, コーディング"/></div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">開始日</label>
              <input type="date" className={inp} value={form.start_date} onChange={e=>set('start_date',e.target.value)}/></div>
            <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">期限</label>
              <input type="date" className={inp} value={form.due_date} onChange={e=>set('due_date',e.target.value)}/></div>
          </div>
          <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">進捗率 ({form.progress}%)</label>
            <input type="range" min={0} max={100} step={5} className="w-full accent-indigo-600" value={form.progress} onChange={e=>set('progress',e.target.value)}/>
            <div className="mt-1"><ProgressBar pct={Number(form.progress)} height={6}/></div></div>
          <div><label className="text-xs font-black text-gray-500 uppercase tracking-wide mb-1.5 block">プロジェクト</label>
            <select className={inp} value={form.project_id} onChange={e=>set('project_id',e.target.value)}>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
          <div className="flex gap-3 pt-2">
            <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 font-bold">キャンセル</button>
            <button type="submit" disabled={saving} className="flex-1 py-3 rounded-xl bg-indigo-600 text-white text-sm hover:bg-indigo-700 font-black disabled:opacity-50">{saving?'保存中…':'保存する'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── Detail Panel ─────────────────────────────────────────────────────
function DetailPanel({taskId,projects,onClose,onEdit,onDeleted,tick,currentUser}){
  const[task,setTask]=useState(null);
  const[isLoading,setIsLoading]=useState(true);
  const[newSub,setNewSub]=useState('');
  const[comment,setComment]=useState('');
  const[delConf,setDelConf]=useState(false);

  const load=useCallback(async()=>{
    setIsLoading(true);
    try{const t=await CRUD.getTask(taskId);setTask(t);}
    catch(e){console.error(e);}
    finally{setIsLoading(false);}
  },[taskId]);

  useEffect(()=>{load();},[load,tick]);

  if(isLoading||!task)return(
    <div className="w-80 shrink-0 bg-white border-l flex items-center justify-center" style={{minWidth:320}}>
      <Spinner/>
    </div>
  );

  const st=ST[task.status]||ST['未着手'];
  const project=projects.find(p=>p.id===task.project_id);
  const labels=(task.labels||'').split(',').map(l=>l.trim()).filter(Boolean);
  const doneSubs=task.subtasks.filter(s=>s.status==='done').length;
  const autoP=task.subtasks.length?Math.round(doneSubs/task.subtasks.length*100):0;
  const pct=task.progress||autoP;

  async function addSub(){
    if(!newSub.trim())return;
    try{await CRUD.createSubtask(task.id,newSub);setNewSub('');await load();}
    catch(e){console.error(e);}
  }
  async function postComment(){
    if(!comment.trim())return;
    try{await CRUD.createComment(task.id,comment,currentUser?.display_name||'ゲスト');setComment('');await load();}
    catch(e){console.error(e);}
  }
  async function delTask(){
    try{await CRUD.deleteTask(task.id);onDeleted();}
    catch(e){console.error(e);}
  }
  async function handleToggleSub(s){
    try{await CRUD.toggleSubtask(s.id,s.status);await load();}
    catch(e){console.error(e);}
  }
  async function handleDeleteSub(id){
    try{await CRUD.deleteSubtask(id);await load();}
    catch(e){console.error(e);}
  }
  async function handleDeleteComment(id){
    try{await CRUD.deleteComment(id);await load();}
    catch(e){console.error(e);}
  }

  const F=({label,children})=><div className="flex items-start gap-3 py-2.5 border-b border-gray-50"><span className="text-xs text-gray-400 w-16 shrink-0 pt-0.5 font-semibold">{label}</span><div className="flex-1 text-xs">{children}</div></div>;

  return(
    <div className="w-80 shrink-0 bg-white border-l border-gray-200 flex flex-col overflow-hidden panel-enter" style={{minWidth:320}}>
      <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <span className="text-xs font-black text-gray-500 uppercase tracking-wide">タスク詳細</span>
        <div className="flex items-center gap-1">
          <button onClick={onEdit} className="text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold">編集</button>
          {delConf?<><button onClick={delTask} className="text-xs px-2.5 py-1 rounded-lg bg-red-500 text-white hover:bg-red-600 font-semibold">確認</button><button onClick={()=>setDelConf(false)} className="text-xs px-2 py-1 rounded-lg border hover:bg-gray-50">✕</button></>
            :<button onClick={()=>setDelConf(true)} className="text-xs px-2.5 py-1 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 font-semibold">削除</button>}
          <button onClick={onClose} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 text-xl ml-1">&times;</button>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto">
        <div className="px-4 py-4 border-b border-gray-100"><p className="text-sm font-black text-gray-900 leading-snug">{task.title}</p></div>
        <div className="px-4 py-1">
          <F label="担当者">{task.assignee?<div className="flex items-center gap-1.5"><Avatar name={task.assignee} size={18}/>{task.assignee}</div>:<span className="text-gray-300">未設定</span>}</F>
          <F label="開始日">{task.start_date?<span>{fmtDateLong(task.start_date)}</span>:<span className="text-gray-300">未設定</span>}</F>
          <F label="期限">{task.due_date?<span className={isOverdue(task.due_date,task.status)?'text-red-500 font-bold':''}>{fmtDateLong(task.due_date)}{isOverdue(task.due_date,task.status)?' ⚠':''}</span>:<span className="text-gray-300">未設定</span>}</F>
          <F label="PJ"><span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm inline-block shrink-0" style={{background:project?.color}}/>{project?.name}</span></F>
          <F label="状態"><StBadge s={task.status}/></F>
          <F label="優先度"><PriBadge p={task.priority}/></F>
          {labels.length>0&&<F label="ラベル"><div className="flex flex-wrap gap-1">{labels.map(l=><LabelPill key={l} label={l}/>)}</div></F>}
        </div>
        {task.description&&<div className="px-4 py-3 border-t border-gray-100"><p className="text-xs font-black text-gray-500 mb-1.5">説明</p><p className="text-xs text-gray-700 bg-gray-50 rounded-xl p-3 whitespace-pre-wrap">{task.description}</p></div>}
        <div className="px-4 py-3 border-t border-gray-100">
          <div className="flex justify-between mb-1"><p className="text-xs font-black text-gray-500">進捗</p><span className="text-xs font-bold text-gray-500">{pct}%</span></div>
          <ProgressBar pct={pct} height={8}/>
        </div>
        <div className="px-4 py-3 border-t border-gray-100">
          <p className="text-xs font-black text-gray-500 mb-2">チェックリスト {task.subtasks.length>0&&<span className="font-normal text-gray-400">({doneSubs}/{task.subtasks.length})</span>}</p>
          <div className="space-y-1.5 mb-2">
            {task.subtasks.map(s=>(
              <div key={s.id} className="flex items-center gap-2 group">
                <input type="checkbox" checked={s.status==='done'} onChange={()=>handleToggleSub(s)} className="rounded border-gray-300 text-indigo-600 cursor-pointer"/>
                <span className={`flex-1 text-xs ${s.status==='done'?'line-through text-gray-400':'text-gray-700'}`}>{s.title}</span>
                <button onClick={()=>handleDeleteSub(s.id)} className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-sm">×</button>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input className="flex-1 border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-200"
              value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addSub()} placeholder="＋ 項目を追加…"/>
            <button onClick={addSub} className="text-xs px-2.5 py-1.5 bg-indigo-50 text-indigo-600 rounded-xl hover:bg-indigo-100 font-bold">追加</button>
          </div>
        </div>
        <div className="px-4 py-3 border-t border-gray-100">
          <p className="text-xs font-black text-gray-500 mb-2">コメント {task.comments.length>0&&<span className="font-normal text-gray-400">({task.comments.length})</span>}</p>
          {task.comments.map(c=>(
            <div key={c.id} className="flex gap-2 mb-3 group">
              <Avatar name={c.author} size={22}/>
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-1 justify-between">
                  <span className="text-xs font-black text-gray-700">{c.author}</span>
                  <div className="flex items-center gap-1">
                    <span className="text-xs text-gray-400">{new Date(c.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
                    <button onClick={()=>handleDeleteComment(c.id)} className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-xs">×</button>
                  </div>
                </div>
                <p className="text-xs text-gray-600 mt-0.5 whitespace-pre-wrap">{c.content}</p>
              </div>
            </div>
          ))}
          <div className="flex gap-2 mt-1">
            <Avatar name={currentUser?.display_name||'ゲスト'} size={22}/>
            <div className="flex-1 flex gap-1">
              <input className="flex-1 border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-200"
                value={comment} onChange={e=>setComment(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&postComment()} placeholder="コメントを追加…"/>
              <button onClick={postComment} className="text-xs px-2.5 py-1.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-black">投稿</button>
            </div>
          </div>
        </div>
        <div className="px-4 py-3 border-t border-gray-100"><p className="text-xs text-gray-300">更新: {new Date(task.updated_at).toLocaleString('ja-JP')}</p></div>
      </div>
    </div>
  );
}

// ─── Sidebar ──────────────────────────────────────────────────────────
function Sidebar({projects,activeProjectId,onSelect,reload,onProjectDeleted,view,onView,currentUser,onLogout,taskCounts}){
  const[adding,setAdding]=useState(false);
  const[newName,setNewName]=useState('');
  const[newColor,setNewColor]=useState('#6366f1');
  const COLORS=['#6366f1','#0ea5e9','#f59e0b','#10b981','#ec4899','#ef4444'];

  async function addProject(){
    if(!newName.trim())return;
    try{
      await CRUD.createProject({name:newName,color:newColor});
      setNewName('');setNewColor('#6366f1');setAdding(false);reload();
    }catch(e){console.error(e);}
  }

  const navItems=[
    {id:'dashboard',label:'ダッシュボード',icon:'📊'},
    {id:'wbs',label:'WBS',icon:'📋'},
    {id:'board',label:'ボード',icon:'⬛'},
    {id:'list',label:'リスト',icon:'☰'},
    {id:'calendar',label:'カレンダー',icon:'📅'},
    ...(currentUser?.role==='admin'?[{id:'users',label:'ユーザー管理',icon:'👥'}]:[]),
  ];

  return(
    <div className="w-52 shrink-0 bg-white border-r border-gray-100 flex flex-col h-full" style={{boxShadow:'1px 0 0 #f1f5f9'}}>
      <div className="px-4 py-4 border-b border-gray-100">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center shadow-sm"><span className="text-white font-black text-sm">T</span></div>
          <span className="font-black text-gray-900 text-sm tracking-tight">TaskFlow Pro</span>
        </div>
      </div>
      <div className="px-3 pt-3">
        <button onClick={()=>onView('board')} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-black py-2.5 rounded-xl transition-colors flex items-center justify-center gap-1.5 shadow-sm">
          <span className="text-base leading-none">+</span> 新しいタスク
        </button>
      </div>
      <div className="px-2 pt-3 space-y-0.5">
        {navItems.map(n=>(
          <button key={n.id} onClick={()=>onView(n.id)}
            className={`w-full text-left px-3 py-2 rounded-xl text-sm flex items-center gap-2.5 transition-colors font-semibold ${view===n.id?'bg-indigo-50 text-indigo-700':'text-gray-600 hover:bg-gray-50'}`}>
            <span>{n.icon}</span>{n.label}
          </button>
        ))}
      </div>
      <div className="px-3 mt-4 mb-1 flex items-center justify-between">
        <span className="text-xs font-black text-gray-400 uppercase tracking-widest">プロジェクト</span>
        <button onClick={()=>setAdding(v=>!v)} className="w-5 h-5 flex items-center justify-center text-gray-400 hover:text-indigo-600 text-lg leading-none">+</button>
      </div>
      {adding&&(
        <div className="px-3 mb-2 space-y-1.5">
          <input autoFocus className="w-full border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-200"
            value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'?addProject():e.key==='Escape'&&setAdding(false)} placeholder="プロジェクト名 (Enter)"/>
          <div className="flex gap-1.5">{COLORS.map(c=><button key={c} onClick={()=>setNewColor(c)} className={`w-5 h-5 rounded-full transition-transform ${newColor===c?'scale-125 ring-2 ring-offset-1 ring-gray-400':'hover:scale-110'}`} style={{background:c}}/>)}</div>
        </div>
      )}
      <div className="flex-1 overflow-y-auto px-2 pb-3 space-y-0.5">
        <button onClick={()=>onSelect(null)} className={`w-full text-left px-3 py-2 rounded-xl text-sm font-semibold transition-colors ${!activeProjectId?'bg-indigo-50 text-indigo-700':'text-gray-600 hover:bg-gray-50'}`}>すべて</button>
        {projects.map(p=>(
          <div key={p.id} className="group flex items-center">
            <button onClick={()=>onSelect(p.id)} className={`flex-1 min-w-0 text-left px-3 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center gap-2 ${activeProjectId===p.id?'bg-indigo-50 text-indigo-700':'text-gray-600 hover:bg-gray-50'}`}>
              <span className="w-2.5 h-2.5 rounded-sm shrink-0" style={{background:p.color}}/><span className="truncate">{p.name}</span>
              <span className="text-xs text-gray-400 ml-auto shrink-0">{taskCounts[p.id]||0}</span>
            </button>
            <button onClick={()=>onProjectDeleted(p.id)} className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 px-1 text-sm">×</button>
          </div>
        ))}
      </div>
      <div className="px-3 py-3 border-t border-gray-100">
        <div className="flex items-center gap-2">
          {currentUser&&<Avatar name={currentUser.display_name} size={28}/>}
          <div className="min-w-0 flex-1">
            <p className="text-xs font-black text-gray-700 truncate">{currentUser?.display_name||'ゲスト'}</p>
            <p className="text-xs text-gray-400 truncate">{currentUser?.username}</p>
          </div>
          <button onClick={onLogout} className="text-xs text-gray-400 hover:text-red-500 px-1.5 py-1 rounded-lg hover:bg-red-50 transition-colors shrink-0 font-semibold" title="ログアウト">⏻</button>
        </div>
      </div>
    </div>
  );
}

// ─── Filter Bar ───────────────────────────────────────────────────────

  const inp="border border-gray-200 rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 bg-white text-gray-700 font-semibold";
  const has=filters.q||filters.status||filters.priority||filters.assignee;
  return(
    <div className="flex items-center flex-wrap gap-2 px-6 py-3 bg-white border-b border-gray-100">
      <input className={`${inp} w-48`} placeholder="🔍 タスクを検索…" value={filters.q} onChange={e=>onChange({...filters,q:e.target.value})}/>
      <select className={inp} value={filters.assignee} onChange={e=>onChange({...filters,assignee:e.target.value})}>
        <option value="">👤 担当者</option>{assignees.map(a=><option key={a}>{a}</option>)}
      </select>
      <select className={inp} value={filters.status} onChange={e=>onChange({...filters,status:e.target.value})}>
        <option value="">ステータス</option>{STATUSES.map(s=><option key={s}>{s}</option>)}
      </select>
      <select className={inp} value={filters.priority} onChange={e=>onChange({...filters,priority:e.target.value})}>
        <option value="">優先度</option>{PRIORITIES.map(p=><option key={p}>{p}</option>)}
      </select>
      {has&&<button onClick={()=>onChange({q:'',status:'',priority:'',assignee:''})} className="text-xs text-indigo-600 hover:text-indigo-800 px-3 py-1.5 hover:bg-indigo-50 rounded-xl font-black">フィルターをクリア</button>}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────
function App(){
  const[currentUser,setCurrentUser]=useState(()=>getActiveSession());
  const[tick,setTick]=useState(0);
  const refresh=useCallback(()=>setTick(t=>t+1),[]);
  const[activeProjectId,setActiveProjectId]=useState(null);
  const[view,setView]=useState('dashboard');
  const[filters,setFilters]=useState({q:'',status:'',priority:'',assignee:''});
  const[selectedId,setSelectedId]=useState(null);
  const[taskForm,setTaskForm]=useState(null);

  // Data states
  const[projects,setProjects]=useState([]);
  const[tasks,setTasks]=useState([]);
  const[allTasksForCal,setAllTasksForCal]=useState([]);
  const[subtasksMap,setSubtasksMap]=useState({});
  const[dashData,setDashData]=useState(null);
  const[users,setUsers]=useState([]);
  const[taskCounts,setTaskCounts]=useState({});
  const[isLoadingTasks,setIsLoadingTasks]=useState(false);
  const[isLoadingDash,setIsLoadingDash]=useState(false);

  // Load projects
  useEffect(()=>{
    async function load(){
      try{const data=await CRUD.getProjects();setProjects(data);}
      catch(e){console.error('projects load error',e);}
    }
    load();
  },[tick]);

  // Load tasks with filters
  useEffect(()=>{
    if(!currentUser)return;
    setIsLoadingTasks(true);
    async function load(){
      try{
        const data=await CRUD.getTasks({project_id:activeProjectId||undefined,...filters});
        setTasks(data);
        // Build subtasks map for WBS
        const tids=data.map(t=>t.id);
        if(tids.length>0){
          const{data:subs}=await supabase.from('tfp_subtasks').select('*').in('task_id',tids).order('created_at',{ascending:true});
          const map={};
          (subs||[]).forEach(s=>{if(!map[s.task_id])map[s.task_id]=[];map[s.task_id].push(s);});
          setSubtasksMap(map);
        }else{setSubtasksMap({});}
      }catch(e){console.error('tasks load error',e);}
      finally{setIsLoadingTasks(false);}
    }
    load();
  },[tick,activeProjectId,filters,currentUser]);

  // Load all tasks for calendar (no filters except project)
  useEffect(()=>{
    if(!currentUser)return;
    async function load(){
      try{const data=await CRUD.getTasks({project_id:activeProjectId||undefined});setAllTasksForCal(data);}
      catch(e){console.error(e);}
    }
    load();
  },[tick,activeProjectId,currentUser]);

  // Load dashboard data
  useEffect(()=>{
    if(!currentUser||view!=='dashboard')return;
    setIsLoadingDash(true);
    async function load(){
      try{const data=await CRUD.getDashboard(activeProjectId||undefined);setDashData(data);}
      catch(e){console.error(e);}
      finally{setIsLoadingDash(false);}
    }
    load();
  },[tick,activeProjectId,currentUser,view]);

  // Load users for header avatars
  useEffect(()=>{
    if(!currentUser)return;
    async function load(){
      try{const data=await CRUD.getUsers();setUsers(data);}
      catch(e){console.error(e);}
    }
    load();
  },[tick,currentUser]);

  // Build task counts per project for sidebar
  useEffect(()=>{
    if(!projects.length)return;
    async function load(){
      try{
        const{data}=await supabase.from('tfp_tasks').select('project_id');
        const counts={};
        (data||[]).forEach(t=>{counts[t.project_id]=(counts[t.project_id]||0)+1;});
        setTaskCounts(counts);
      }catch(e){console.error(e);}
    }
    load();
  },[tick,projects]);

  const assignees=useMemo(()=>[...new Set(tasks.map(t=>t.assignee).filter(Boolean))],[tasks]);

  if(!currentUser)return<LoginScreen onLogin={u=>{setCurrentUser(u)}}/>;

  async function handleDrop(taskId,newStatus){
    try{await CRUD.updateTask(taskId,{status:newStatus});refresh();}
    catch(e){console.error(e);}
  }
  async function deleteProject(id){
    if(!confirm('このプロジェクトと全タスクを削除しますか？'))return;
    try{await CRUD.deleteProject(id);if(activeProjectId===id)setActiveProjectId(null);refresh();}
    catch(e){console.error(e);}
  }
  function handleLogout(){clearSession();setCurrentUser(null);}

  const activeProject=projects.find(p=>p.id===activeProjectId);
  const tabs=[
    {id:'dashboard',label:'概要'},
    {id:'wbs',label:'WBS'},
    {id:'board',label:'ボード'},
    {id:'list',label:'リスト'},
    {id:'calendar',label:'カレンダー'},
    ...(currentUser?.role==='admin'?[{id:'users',label:'👥 ユーザー'}]:[]),
  ];

  return(
    <div className="flex h-screen overflow-hidden bg-gray-50">
      <Sidebar projects={projects} activeProjectId={activeProjectId}
        onSelect={id=>{setActiveProjectId(id);setSelectedId(null);}} reload={refresh}
        onProjectDeleted={deleteProject} view={view} onView={v=>{setView(v);setSelectedId(null);}}
        currentUser={currentUser} onLogout={handleLogout} taskCounts={taskCounts}/>

      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div className="bg-white border-b border-gray-100 px-6 pt-4 pb-0">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-3">
              {activeProject&&<span className="w-3 h-3 rounded-sm shrink-0" style={{background:activeProject.color}}/>}
              <h1 className="text-lg font-black text-gray-900">{activeProject?.name??'すべてのタスク'}</h1>
            </div>
            <div className="flex items-center gap-3">
              <div className="flex -space-x-1.5">
                {users.slice(0,4).map(u=><div key={u.id} className="ring-2 ring-white rounded-full"><Avatar name={u.display_name} size={28}/></div>)}
              </div>
              <button onClick={()=>setTaskForm({})} className="px-4 py-2 bg-indigo-600 text-white text-sm font-black rounded-xl hover:bg-indigo-700 shadow-sm">+ 新しいタスク</button>
            </div>
          </div>
          <div className="flex">
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setView(t.id)}
                className={`px-4 py-2.5 text-sm font-bold border-b-2 -mb-px transition-colors ${view===t.id?'tab-active':'border-transparent text-gray-500 hover:text-gray-700'}`}>
                {t.label}
              </button>
            ))}
          </div>
        </div>

        {view!=='dashboard'&&view!=='calendar'&&view!=='users'&&<FilterBar filters={filters} onChange={setFilters} assignees={assignees||[]}/>}

        <div className="flex-1 flex min-h-0 overflow-hidden">
          <div className="flex-1 overflow-auto">
            {view==='dashboard'&&<DashboardView projects={projects} activeProjectId={activeProjectId} dashData={dashData} isLoading={isLoadingDash}/>}
            {view==='wbs'&&(isLoadingTasks?<Spinner/>:<WBSView tasks={tasks} projects={projects} subtasksMap={subtasksMap} onSelect={id=>setSelectedId(prev=>prev===id?null:id)} onNew={st=>setTaskForm({defaultStatus:st})} selectedId={selectedId}/>)}
            {view==='board'&&(
              <div className="p-6">
                {isLoadingTasks?<Spinner/>:
                  <div className="flex gap-5 pb-6" style={{minHeight:'calc(100vh - 230px)',overflowX:'auto'}}>
                    {STATUSES.map(s=><KanbanCol key={s} status={s} tasks={tasks.filter(t=>t.status===s)} onDrop={handleDrop} onCard={id=>setSelectedId(prev=>prev===id?null:id)} onNew={st=>setTaskForm({defaultStatus:st})} selectedId={selectedId}/>)}
                  </div>
                }
              </div>
            )}
            {view==='list'&&<ListView tasks={tasks} onSelect={id=>setSelectedId(prev=>prev===id?null:id)} selectedId={selectedId} onNew={st=>setTaskForm({defaultStatus:st})} isLoading={isLoadingTasks}/>}
            {view==='calendar'&&<CalendarView tasks={allTasksForCal} onSelect={id=>{setSelectedId(id);setView('board');}}/>}
            {view==='users'&&currentUser?.role==='admin'&&<UserManagementView currentUser={currentUser} refresh={refresh}/>}
          </div>

          {selectedId&&view!=='calendar'&&view!=='users'&&(
            <DetailPanel key={selectedId} taskId={selectedId} projects={projects} currentUser={currentUser}
              onClose={()=>setSelectedId(null)}
              onEdit={async()=>{
                try{const t=await CRUD.getTask(selectedId);if(t)setTaskForm({task:t});}
                catch(e){console.error(e);}
              }}
              onDeleted={()=>{setSelectedId(null);refresh();}}
              tick={tick}/>
          )}
        </div>
      </div>

      {taskForm!==null&&(
        <TaskFormModal task={taskForm.task??null} defaultStatus={taskForm.defaultStatus??null}
          projects={projects} onSave={()=>{setTaskForm(null);refresh();}} onClose={()=>setTaskForm(null)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
